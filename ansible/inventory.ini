# FitTrack Deployment Inventory

# Localhost deployment (ideal for DevOps laboratory evaluation and local testing)
[local]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# Production target servers (for multi-node or remote cloud deployment)
[production]
# 192.168.1.100 ansible_user=deployer ansible_ssh_private_key_file=~/.ssh/id_rsa

[all:vars]
ansible_python_interpreter=/usr/bin/python3
