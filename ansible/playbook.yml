---
- name: Deploy FitTrack Application with Docker and SQLite Persistence
  hosts: "{{ target_hosts | default('local') }}"
  gather_facts: true
  become: false

  tasks:
    - name: 1. Verify Docker Engine is installed and accessible
      ansible.builtin.command: docker --version
      register: docker_version_output
      changed_when: false

    - name: Display detected Docker version
      ansible.builtin.debug:
        msg: "Target host Docker runtime verified: {{ docker_version_output.stdout }}"

    - name: 2. Ensure persistent SQLite Docker volume exists
      ansible.builtin.command: docker volume create {{ docker_volume_name | default('fittrack_sqlite_data') }}
      changed_when: false

    - name: 3. Check if Docker image is available locally or needs pulling
      ansible.builtin.command: "docker image inspect {{ docker_image_name }}:{{ docker_image_tag }}"
      register: image_inspect
      ignore_errors: true
      changed_when: false

    - name: Pull Docker image if not present locally
      ansible.builtin.command: "docker pull {{ docker_image_name }}:{{ docker_image_tag }}"
      when: image_inspect.failed
      register: pull_result
      changed_when: pull_result.rc == 0

    - name: 4. Stop and remove existing FitTrack container if running
      ansible.builtin.shell: |
        if [ "$(docker ps -aq -f name=^{{ container_name }}$)" ]; then
          docker rm -f {{ container_name }}
        fi
      register: stop_container
      changed_when: stop_container.stdout != ""

    - name: 5. Run new FitTrack container with persistent SQLite volume
      ansible.builtin.command: >
        docker run -d
        --name {{ container_name }}
        --restart {{ restart_policy }}
        -p {{ host_port }}:{{ container_port }}
        -v {{ docker_volume_name | default('fittrack_sqlite_data') }}:/app/data
        -e FLASK_ENV=production
        -e DATABASE_PATH=/app/data/{{ sqlite_db_filename }}
        -e PORT={{ container_port }}
        {{ docker_image_name }}:{{ docker_image_tag }}
      register: run_container
      changed_when: run_container.rc == 0

    - name: 6. Wait for FitTrack application to initialize
      ansible.builtin.pause:
        seconds: 4

    - name: 7. Verify application health check endpoint
      ansible.builtin.command: docker exec {{ container_name }} curl -s -f http://localhost:{{ container_port }}/api/health
      register: health_check_response
      retries: "{{ health_check_retries }}"
      delay: "{{ health_check_delay }}"
      until: health_check_response.rc == 0 and 'healthy' in health_check_response.stdout
      changed_when: false

    - name: 8. Report Deployment Success
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "FitTrack Deployment Completed Successfully!"
          - "Container Name: {{ container_name }}"
          - "Image:          {{ docker_image_name }}:{{ docker_image_tag }}"
          - "Application URL: http://localhost:{{ host_port }}"
          - "Health Status:   healthy"
          - "Database Engine: SQLite (fittrack.db)"
          - "Docker Volume:   {{ docker_volume_name | default('fittrack_sqlite_data') }}"
          - "=========================================================="
